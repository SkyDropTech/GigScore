version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gigscore-backend
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=gigscore_super_secret_jwt_key_2026_production_grade
      - DATABASE_URL=sqlite:///./gigscore.db
    volumes:
      - ./backend:/app
      - ./ml:/ml
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gigscore-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
